name: Deploy OCI

on:
  workflow_run:
    workflows: ["Axiom CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reindex:
        description: Rebuild the persistent Chroma index after the image rollout
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: production-oci
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      OCI_DEPLOY_HOST: ${{ vars.OCI_DEPLOY_HOST }}
      OCI_DEPLOY_USER: ${{ vars.OCI_DEPLOY_USER }}
      OCI_DEPLOY_PATH: ${{ vars.OCI_DEPLOY_PATH }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      GHCR_NAMESPACE: ghcr.io/${{ github.repository_owner }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REINDEX: ${{ inputs.reindex || false }}

    steps:
      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release SHA"; exit 1; }
          test -n "$OCI_DEPLOY_HOST"
          test -n "$OCI_DEPLOY_USER"
          test -n "$OCI_DEPLOY_PATH"
          test -n "$PUBLIC_URL"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_TOKEN"
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "Invalid GHCR username"; exit 1; }
          case "$PUBLIC_URL" in
            http://*|https://*) ;;
            *) echo "PUBLIC_URL must use http:// or https://"; exit 1 ;;
          esac

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/axiom-oci"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/axiom-oci" "$HOME/.ssh/known_hosts"

      - name: Configure production AI providers
        env:
          RUNTIME_NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          RUNTIME_MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY || secrets.NVIDIA_API_KEY }}
          RUNTIME_EMBEDDING_API_KEY: ${{ secrets.AXIOM_EMBEDDING_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNTIME_NVIDIA_API_KEY"
          test -n "$RUNTIME_MINIMAX_API_KEY"
          test -n "$RUNTIME_EMBEDDING_API_KEY"

          local_settings="$RUNNER_TEMP/axiom-ai.env"
          remote_settings="/tmp/axiom-ai-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"
          trap 'rm -f "$local_settings"' EXIT
          umask 077
          {
            printf 'NVIDIA_API_KEY=%s\n' "$RUNTIME_NVIDIA_API_KEY"
            printf 'MINIMAX_API_KEY=%s\n' "$RUNTIME_MINIMAX_API_KEY"
            printf 'AXIOM_EMBEDDING_API_KEY=%s\n' "$RUNTIME_EMBEDDING_API_KEY"
            printf '%s\n' \
              'AXIOM_NVIDIA_ENABLED=false' \
              'AXIOM_LLM_PROVIDER=' \
              'AXIOM_LLM_FALLBACK=' \
              'AXIOM_LLM_ROUTES=nvidia-minimax,deterministic' \
              'NVIDIA_MODEL=meta/muse-glimmer-30b' \
              'NVIDIA_MINIMAX_MODEL=minimaxai/minimax-m3' \
              'AXIOM_EMBEDDING_PROVIDER=openai' \
              'AXIOM_EMBEDDING_MODEL=nvidia/llama-nemotron-embed-1b-v2' \
              'AXIOM_EMBEDDING_DIMENSIONS=384' \
              'AXIOM_EMBEDDING_BASE_URL=https://integrate.api.nvidia.com/v1' \
              'AXIOM_EMBEDDING_INPUT_TYPE=auto'
          } > "$local_settings"

          scp \
            -i "$HOME/.ssh/axiom-oci" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$local_settings" \
            "$OCI_DEPLOY_USER@$OCI_DEPLOY_HOST:$remote_settings"

          printf -v remote_args '%q ' "$OCI_DEPLOY_PATH" "$remote_settings"
          ssh \
            -i "$HOME/.ssh/axiom-oci" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_DEPLOY_USER@$OCI_DEPLOY_HOST" \
            "python3 - $remote_args" <<'PY'
          import os
          import pathlib
          import sys

          allowed = {
              "NVIDIA_API_KEY",
              "MINIMAX_API_KEY",
              "AXIOM_EMBEDDING_API_KEY",
              "AXIOM_NVIDIA_ENABLED",
              "AXIOM_LLM_PROVIDER",
              "AXIOM_LLM_FALLBACK",
              "AXIOM_LLM_ROUTES",
              "NVIDIA_MODEL",
              "NVIDIA_MINIMAX_MODEL",
              "AXIOM_EMBEDDING_PROVIDER",
              "AXIOM_EMBEDDING_MODEL",
              "AXIOM_EMBEDDING_DIMENSIONS",
              "AXIOM_EMBEDDING_BASE_URL",
              "AXIOM_EMBEDDING_INPUT_TYPE",
          }
          deploy_root, payload = map(pathlib.Path, sys.argv[1:])
          target = deploy_root / ".env"
          try:
              updates = dict(
                  line.split("=", 1)
                  for line in payload.read_text().splitlines()
                  if line
              )
              empty_allowed = {"AXIOM_LLM_PROVIDER", "AXIOM_LLM_FALLBACK"}
              required = allowed - empty_allowed
              if set(updates) != allowed or not all(updates[key] for key in required):
                  raise SystemExit("Invalid runtime AI settings")
              existing = target.read_text().splitlines() if target.exists() else []
              output, written = [], set()
              for line in existing:
                  key = line.split("=", 1)[0].strip() if "=" in line else ""
                  if key in updates:
                      if key not in written:
                          output.append(f"{key}={updates[key]}")
                          written.add(key)
                  else:
                      output.append(line)
              output.extend(
                  f"{key}={updates[key]}" for key in sorted(allowed - written)
              )
              replacement = target.with_name(target.name + ".next")
              replacement.write_text("\n".join(output) + "\n")
              os.chmod(replacement, 0o600)
              os.replace(replacement, target)
          finally:
              payload.unlink(missing_ok=True)
          PY

      - name: Authenticate VM to GHCR
        shell: bash
        run: |
          set -euo pipefail
          printf -v ghcr_user_arg '%q' "$GHCR_USERNAME"
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i "$HOME/.ssh/axiom-oci" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_DEPLOY_USER@$OCI_DEPLOY_HOST" \
            "sudo -n docker login ghcr.io --username $ghcr_user_arg --password-stdin"

      - name: Pull and run the approved immutable images
        shell: bash
        run: |
          set -euo pipefail
          printf -v remote_args '%q ' "$RELEASE_SHA" "$OCI_DEPLOY_PATH" "$PUBLIC_URL" "$GHCR_NAMESPACE" "$REINDEX"
          ssh \
            -i "$HOME/.ssh/axiom-oci" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_DEPLOY_USER@$OCI_DEPLOY_HOST" \
            "bash -s -- $remote_args" <<'REMOTE'
          set -euo pipefail

          RELEASE_SHA="$1"
          DEPLOY_PATH="$2"
          PUBLIC_URL="$3"
          GHCR_NAMESPACE="$4"
          REINDEX="$5"

          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release SHA"; exit 1; }
          [[ "$DEPLOY_PATH" = /* ]] || { echo "OCI_DEPLOY_PATH must be absolute"; exit 1; }
          [[ "$GHCR_NAMESPACE" =~ ^ghcr\.io/[a-z0-9_.-]+$ ]] || { echo "Invalid GHCR namespace"; exit 1; }
          [[ "$REINDEX" = true || "$REINDEX" = false ]] || { echo "Invalid reindex flag"; exit 1; }

          trap 'sudo -n docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          sudo -n chown -R "$(id -u):$(id -g)" "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"
          git fetch --prune --depth=1 origin "$RELEASE_SHA"
          git reset --hard "$RELEASE_SHA"
          test -s .env

          export AXIOM_API_IMAGE="$GHCR_NAMESPACE/axiom-tech-api:sha-$RELEASE_SHA"
          export AXIOM_FRONTEND_IMAGE="$GHCR_NAMESPACE/axiom-tech-frontend:sha-$RELEASE_SHA"

          compose_for_project() {
            local project_name="$1"
            shift
            sudo -n env \
              AXIOM_API_IMAGE="$AXIOM_API_IMAGE" \
              AXIOM_FRONTEND_IMAGE="$AXIOM_FRONTEND_IMAGE" \
              AXIOM_CORS_ORIGINS="$PUBLIC_URL" \
              docker compose \
                --project-name "$project_name" \
                -f docker-compose.yml \
                -f docker-compose.oci.yml \
                -f docker-compose.gateway.yml "$@"
          }

          compose() {
            compose_for_project axiom "$@"
          }

          compose config --quiet
          compose pull --quiet

          # A previous workflow briefly inferred the repository directory name as
          # the Compose project. Remove only that partial stack before replacing
          # the established `axiom` deployment; persistent volumes are preserved.
          if sudo -n docker ps -a \
            --filter label=com.docker.compose.project=axiom-tech \
            --format '{{.ID}}' | grep -q .; then
            compose_for_project axiom-tech down --remove-orphans
          fi

          compose up -d --no-build --remove-orphans --wait --wait-timeout 90
          compose ps

          if [[ "$REINDEX" = true ]]; then
            compose exec -T api python -m app.main --ingest
          fi

          curl --fail --silent --show-error --connect-timeout 5 --max-time 30 --retry 10 --retry-connrefused --retry-delay 3 http://127.0.0.1:8080/api/v1/health
          REMOTE

      - name: Verify public URL
        if: startsWith(env.PUBLIC_URL, 'https://')
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 "$PUBLIC_URL/api/v1/health"
