# Public OCI override. Set PUBLIC_HOST to a DNS name before starting.
services:
  api:
    ports: !reset []

  frontend:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
