# Public OCI override. Set PUBLIC_HOST to a DNS name before starting.
services:
  api:
    ports: !reset []

  frontend:
    ports: !reset []

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    pull_policy: always
    init: true
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    mem_reservation: 16m
    pids_limit: 64
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
