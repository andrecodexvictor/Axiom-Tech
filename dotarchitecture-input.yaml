# DotArchitecture input: Axiom Tech V3
project:
  name: "axiom-tech-corporate-knowledge-assistant"
  targetStack: "python/fastapi"
  version: "v3"

context:
  teamSize: 5
  teamMaturity: "intermediate"
  domainComplexity: "medium"
  scale: "medium"
  availability: "medium"
  auditability: true

overrides:
  architecture: "modular-monolith"
  pattern: "layered-with-ports-at-integration-seams"

rules:
  minTeamSizeForMicroservices: 15
  minScaleForEventDriven: "high"
  maxMaturityForActiveRecord: "junior"
  requireVersionedApiBoundary: true
  requireGroundedCitations: true
  requireOfflineDeterministicMode: true

templatesDir: "./custom-templates"

hooks:
  onArchitectureChange: "echo 'Architecture changed'"
  onNewModuleDesigned: "echo 'New module designed'"
  plugins: []
