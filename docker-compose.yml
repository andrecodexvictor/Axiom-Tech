name: axiom-tech

services:
  api:
    image: ${AXIOM_API_IMAGE:?AXIOM_API_IMAGE must reference an immutable GHCR image}
    pull_policy: always
    init: true
    environment:
      AXIOM_DOCUMENTS_DIR: /app/documentos
      AXIOM_CHROMA_PATH: /data/chroma
      AXIOM_CHROMA_COLLECTION: ${AXIOM_CHROMA_COLLECTION:-axiom_knowledge}
      AXIOM_VECTOR_BACKEND: ${AXIOM_VECTOR_BACKEND:-chroma}
      AXIOM_EMBEDDING_PROVIDER: ${AXIOM_EMBEDDING_PROVIDER:-deterministic}
      AXIOM_EMBEDDING_MODEL: ${AXIOM_EMBEDDING_MODEL:-text-embedding-3-small}
      AXIOM_EMBEDDING_DIMENSIONS: ${AXIOM_EMBEDDING_DIMENSIONS:-384}
      AXIOM_EMBEDDING_BASE_URL: ${AXIOM_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      AXIOM_EMBEDDING_API_KEY: ${AXIOM_EMBEDDING_API_KEY:-}
      AXIOM_EMBEDDING_INPUT_TYPE: ${AXIOM_EMBEDDING_INPUT_TYPE:-auto}
      AXIOM_EMBEDDING_TIMEOUT_SECONDS: ${AXIOM_EMBEDDING_TIMEOUT_SECONDS:-10}
      AXIOM_EMBEDDING_BATCH_SIZE: ${AXIOM_EMBEDDING_BATCH_SIZE:-64}
      AXIOM_RETRIEVAL_CANDIDATE_MULTIPLIER: ${AXIOM_RETRIEVAL_CANDIDATE_MULTIPLIER:-4}
      AXIOM_RETRIEVAL_MIN_SCORE: ${AXIOM_RETRIEVAL_MIN_SCORE:-0.12}
      AXIOM_RETRIEVAL_LEXICAL_WEIGHT: ${AXIOM_RETRIEVAL_LEXICAL_WEIGHT:-0.25}
      AXIOM_RETRIEVAL_MMR_LAMBDA: ${AXIOM_RETRIEVAL_MMR_LAMBDA:-0.75}
      AXIOM_LLM_PROVIDER: ${AXIOM_LLM_PROVIDER:-}
      AXIOM_LLM_FALLBACK: ${AXIOM_LLM_FALLBACK:-}
      AXIOM_LLM_ROUTES: ${AXIOM_LLM_ROUTES:-}
      AXIOM_LLM_TIMEOUT_SECONDS: ${AXIOM_LLM_TIMEOUT_SECONDS:-8}
      AXIOM_LLM_MAX_RETRIES: ${AXIOM_LLM_MAX_RETRIES:-0}
      AXIOM_LLM_CIRCUIT_FAILURE_THRESHOLD: ${AXIOM_LLM_CIRCUIT_FAILURE_THRESHOLD:-3}
      AXIOM_LLM_CIRCUIT_RECOVERY_SECONDS: ${AXIOM_LLM_CIRCUIT_RECOVERY_SECONDS:-30}
      AXIOM_NVIDIA_ENABLED: ${AXIOM_NVIDIA_ENABLED:-false}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/muse-glimmer-30b}
      AXIOM_NVIDIA_BASE_URL: ${AXIOM_NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_KIMI_MODEL: ${NVIDIA_KIMI_MODEL:-moonshotai/kimi-k2.6}
      NVIDIA_MINIMAX_MODEL: ${NVIDIA_MINIMAX_MODEL:-minimaxai/minimax-m3}
      NVIDIA_DEEPSEEK_MODEL: ${NVIDIA_DEEPSEEK_MODEL:-deepseek-ai/deepseek-v4-pro}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AXIOM_OPENAI_BASE_URL: ${AXIOM_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AXIOM_OPENAI_ALLOW_CUSTOM_BASE_URL: ${AXIOM_OPENAI_ALLOW_CUSTOM_BASE_URL:-false}
      AXIOM_CORS_ORIGINS: ${AXIOM_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-axiom-tech-v3}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      LANGSMITH_HIDE_INPUTS: ${LANGSMITH_HIDE_INPUTS:-true}
      LANGSMITH_HIDE_OUTPUTS: ${LANGSMITH_HIDE_OUTPUTS:-true}
      AXIOM_WEB_ENABLED: ${AXIOM_WEB_ENABLED:-false}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      AXIOM_WEB_ALLOWLIST: ${AXIOM_WEB_ALLOWLIST:-docs.python.org,docs.nvidia.com,docs.langchain.com,github.com}
      AXIOM_WEB_TIMEOUT_SECONDS: ${AXIOM_WEB_TIMEOUT_SECONDS:-8}
      AXIOM_WEB_MAX_RESPONSE_BYTES: ${AXIOM_WEB_MAX_RESPONSE_BYTES:-1000000}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-}
      PINECONE_ENVIRONMENT: ${PINECONE_ENVIRONMENT:-}
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 576m
    mem_reservation: 192m
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend:
    image: ${AXIOM_FRONTEND_IMAGE:?AXIOM_FRONTEND_IMAGE must reference an immutable GHCR image}
    pull_policy: always
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=8m,noexec,nosuid
      - /var/run:size=1m,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    mem_reservation: 16m
    pids_limit: 64
    restart: unless-stopped

volumes:
  chroma_data:
