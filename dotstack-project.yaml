# DotStack project input: Axiom Tech V3
product:
  name: "Axiom Tech Corporate Knowledge Assistant"
  type: "InternalTool"

team:
  devs: 5
  experience: "intermediate"

requirements:
  scale: "medium"
  latency: "normal"
  availability: "normal"
  auditability: true
  offlineDevelopment: true

constraints:
  language: "Python"
  cloud: "Docker"
  apiFramework: "FastAPI"
  frontend: "React/Vite"
  vectorStoreDefault: "ChromaDB"
  vectorStoreOptional: "Pinecone"
  llmProviderOptional: "NVIDIA NIM"
  deploymentTarget: "OCI"

delivery:
  architecture: "modular-monolith"
  apiContract: "/api/v1"
  persistentData: "ChromaDB volume"
  secretsPolicy: "runtime-only; never commit"
  localMode: "deterministic offline defaults"
